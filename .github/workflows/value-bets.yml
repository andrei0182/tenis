name: Daily tennis value bets (Superbet vs Pinnacle)

# Once a day: Superbet tennis match-winner odds for today vs Pinnacle's no-vig price; bets with
# EV >= 2% are logged and emailed with the running closing-line record. Mondays also get a
# weekly summary. Manual runs can cover a date range.
# Needs secrets PINNAPI_KEY, GMAIL_ADDRESS, GMAIL_APP_PASSWORD, EMAIL_TO.

permissions:
  contents: write

on:
  schedule:
    # ~09:30-10:30 Romania time; two entries + an "already sent today" marker (cron can run late).
    - cron: "30 6 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Interval: prima zi (YYYY-MM-DD). Gol = doar azi"
        type: string
        default: ""
      end_date:
        description: "Interval: ultima zi (YYYY-MM-DD)"
        type: string
        default: ""
      weekly:
        description: "Trimite și rezumatul săptămânal (altfel doar lunea)"
        type: boolean
        default: false

concurrency:
  group: value-data
  cancel-in-progress: false

jobs:
  value-bets:
    runs-on: ubuntu-latest
    env:
      PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - name: Skip if the PINNAPI_KEY secret is not set
        if: env.PINNAPI_KEY == ''
        run: echo "::notice::PINNAPI_KEY secret missing -- add it in Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: env.PINNAPI_KEY != ''

      - name: Checkout state branch (value-data)
        if: env.PINNAPI_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin value-data >/dev/null; then
            git clone --depth 1 --branch value-data "$url" state
          else
            mkdir state && cd state && git init -q -b value-data && git remote add origin "$url"
          fi

      - name: Skip if already sent today
        if: env.PINNAPI_KEY != '' && github.event_name != 'workflow_dispatch'
        run: |
          today=$(TZ="Europe/Bucharest" date +%F)
          if [ -f state/.last_value_date ] && [ "$(cat state/.last_value_date)" == "$today" ]; then
            echo "Already sent today's value report ($today)."
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        if: env.PINNAPI_KEY != '' && env.SKIP_RUN != 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: env.PINNAPI_KEY != '' && env.SKIP_RUN != 'true'
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Compute today's date
        if: env.PINNAPI_KEY != '' && env.SKIP_RUN != 'true'
        id: date
        run: echo "value=$(TZ='Europe/Bucharest' date +%F)" >> "$GITHUB_OUTPUT"

      - name: Daily value bets
        if: env.PINNAPI_KEY != '' && env.SKIP_RUN != 'true' && inputs.start_date == ''
        run: |
          python value_daily.py --date ${{ steps.date.outputs.value }} --state-dir state
          echo "${{ steps.date.outputs.value }}" > state/.last_value_date

      - name: Date range run (manual)
        if: env.PINNAPI_KEY != '' && inputs.start_date != ''
        env:
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date || inputs.start_date }}
        run: python value_daily.py --date "$START" --end "$END" --state-dir state

      - name: Weekly summary (Mondays, or on demand)
        if: env.PINNAPI_KEY != '' && env.SKIP_RUN != 'true'
        env:
          FORCE_WEEKLY: ${{ inputs.weekly }}
        run: |
          if [ "$(TZ=Europe/Bucharest date +%u)" = "1" ] || [ "$FORCE_WEEKLY" = "true" ]; then
            python value_daily.py --weekly --date ${{ steps.date.outputs.value }} --state-dir state
          else
            echo "Not Monday -- no weekly summary."
          fi

      - name: Commit state
        if: env.PINNAPI_KEY != '' && env.SKIP_RUN != 'true'
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." || git commit -q -m "Value bets $(TZ=Europe/Bucharest date +%F)"
          git push -q origin value-data
