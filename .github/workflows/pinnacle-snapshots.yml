name: Pinnacle tennis snapshots (closing lines for value bets)

# Pinnacle tennis prices for the closing line of the value bets: the last snapshot before each match
# starts is its closing line. Provider: oddspapi.io (ODDSPAPI_KEY; free plan 250 requests/month,
# ~2 per snapshot) or pinnapi.com (PINNAPI_KEY). Two snapshots a day + the morning value run stay
# under the free oddspapi quota; closing lines are therefore approximate (afternoon/evening price).
# State lives on the `value-data` branch, not on main.

permissions:
  contents: write

on:
  schedule:
    - cron: "20 12 * * *"  # ~15:20 Romania time (summer)
    - cron: "20 17 * * *"  # ~20:20 Romania time (summer)
  workflow_dispatch: {}

concurrency:
  group: value-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}
      ODDS_KEYS: ${{ secrets.ODDSPAPI_KEY }}${{ secrets.PINNAPI_KEY }}
    steps:
      - name: Skip if no odds API key secret is set
        if: env.ODDS_KEYS == ''
        run: echo "::notice::ODDSPAPI_KEY (or PINNAPI_KEY) secret missing -- add it in Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v4
        if: env.ODDS_KEYS != ''

      - name: Checkout state branch (value-data)
        if: env.ODDS_KEYS != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin value-data >/dev/null; then
            git clone --depth 1 --branch value-data "$url" state
          else
            mkdir state && cd state && git init -q -b value-data && git remote add origin "$url"
          fi

      - uses: actions/setup-python@v5
        if: env.ODDS_KEYS != ''
        with:
          python-version: "3.12"

      - name: Install
        if: env.ODDS_KEYS != ''
        run: pip install -e .

      - name: Snapshot Pinnacle tennis odds
        if: env.ODDS_KEYS != ''
        run: python -m tenis.pinnacle

      - name: Commit state
        if: env.ODDS_KEYS != ''
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes." || git commit -q -m "Pinnacle snapshot $(date -u +%FT%H:%MZ)"
          git push -q origin value-data
