[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tenis"
version = "0.1.0"
description = "Surface Elo + Klaassen-Magnus Markov tennis model, market blend, Kelly staking and walk-forward backtest"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tenis = "tenis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
